name: Build Windows exe
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'   # 매주 월요일 03:00 KST, 최신 yt-dlp로 재빌드
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bundle ffmpeg
        shell: python
        run: |
          import imageio_ffmpeg, shutil
          shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), "ffmpeg.exe")
      - name: Stamp version
        run: echo v${{ github.run_number }} > VERSION
      - run: pyinstaller --onefile --windowed --name damda --icon damda.ico --add-binary "ffmpeg.exe;." --add-data "damda.ico;." --add-data "VERSION;." damda.py
      - uses: actions/upload-artifact@v4
        with:
          name: damda-windows
          path: dist/damda.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 담다 v${{ github.run_number }}
          files: dist/damda.exe
